name: Actualizar datos y publicar

on:
  schedule:
    # 06:23 y 13:23 UTC: antes de abrir y después de las publicaciones de las 11:00 de Eurostat.
    - cron: "23 6,13 * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas del script
        run: python -m unittest discover tests
      - name: Descargar indicadores
        run: python scripts/fetch_data.py
      - name: Guardar datos si han cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/data.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos actualizados $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

  publicar:
    needs: datos
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
